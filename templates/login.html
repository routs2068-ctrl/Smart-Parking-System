
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Parking System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #84fab0, #8fd3f4);
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .login-title {
            margin-bottom: 12px;
            color: #172b4d;
            font-size: 38px;
            font-weight: 600;
        }

        .login-subtitle {
            margin-bottom: 26px;
            font-size: 18px;
            color: #555555;
        }

        .form-label {
            font-size: 18px;
            margin-bottom: 7px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 7px;
            font-size: 16px;
        }

        .login-button {
            min-height: 48px;
            width: 100%;
            margin-top: 6px;
            font-size: 18px;
            border-radius: 7px;
        }

        .alert {
            margin-top: 18px;
            margin-bottom: 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 28px 22px;
            }

            .login-title {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <main class="login-box">

        <h1 class="login-title text-center">
            🔑 Login
        </h1>

        <p class="login-subtitle text-center">
            Login as <strong>Subhashree Rout</strong>
        </p>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="mb-4">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary login-button">
                Login
            </button>

        </form>

        <!-- Display Flask login messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div
                        class="alert alert-{{ category }}"
                        role="alert"
                    >
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

    </main>
</body>
</html>
