<!DOCTYPE html>
<html>
<head>
    <title>Edit Slot {{slot.id}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Edit Slot {{slot.id}}</h2>
    <form method="POST">
        <div class="mb-3">
            <label>Vehicle Number</label>
            <input type="text" name="vehicle" class="form-control" value="{{ slot.vehicle or '' }}">
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-select">
                <option value="available" {% if slot.status == 'available' %}selected{% endif %}>Available</option>
                <option value="booked" {% if slot.status == 'booked' %}selected{% endif %}>Booked</option>
            </select>
        </div>

        <button class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
